name: CI

on:
  push:
  pull_request:

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - name: Test
        run: swift test
      - name: Verify public API baseline
        run: Tools/check-api-baseline.sh
      - name: Build Android renderer product
        run: swift build --target AthenaNotationRenderAndroid
      - name: Build example
        run: swift build --product AthenaNotationExample

  cocoapods:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Install CocoaPods
        run: gem install cocoapods --no-document
      - name: Lint Podspec
        run: pod lib lint AthenaNotation.podspec --allow-warnings

  android-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile Compose adapter
        working-directory: Examples/AthenaNotationAndroid
        run: >-
          ./gradlew :bridge:compileDebugKotlin
          -x buildSwiftDebugArm64
          -x buildZlibBootstrapArm64
          -x copyDebugSwiftLibraries

  windows-swift:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.3"
      - name: Build portable library
        run: swift build --target AthenaNotationCore
      - name: Build Windows renderer facade
        run: swift build --target AthenaNotationRenderWindows
      - name: Build Windows command-line example
        run: swift build --product AthenaNotationWindowsExample
      - name: Test portable modules
        run: swift test
