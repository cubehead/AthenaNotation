name: CI

on:
  push:
  pull_request:

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - name: Test
        run: swift test
      - name: Build Android renderer product
        run: swift build --target AthenaNotationRenderAndroid
      - name: Build example
        run: swift build --product AthenaNotationExample

  cocoapods:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install CocoaPods
        run: gem install cocoapods --no-document
      - name: Lint Podspec
        run: pod lib lint AthenaNotation.podspec --allow-warnings
